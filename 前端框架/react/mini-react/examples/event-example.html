<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-React 事件系统示例</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    #root {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .outer, .inner {
      padding: 20px;
      border-radius: 6px;
      margin: 10px 0;
      cursor: pointer;
      transition: background 0.2s;
    }
    .outer { background: #e3f2fd; }
    .inner { background: #bbdefb; display: inline-block; }
    .outer:hover, .inner:hover { filter: brightness(0.95); }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    #log {
      background: #263238;
      color: #aed581;
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 13px;
      padding: 16px;
      border-radius: 6px;
      min-height: 120px;
      white-space: pre-wrap;
      margin-top: 20px;
    }
    .tag { color: #80cbc4; }
  </style>
</head>
<body>
  <h1>Mini-React 事件系统</h1>
  <p>打开控制台，点击下方区域观察捕获/冒泡顺序与 stopPropagation 的效果。</p>

  <div id="root"></div>
  <div id="log"></div>

  <script type="module">
    import { createElement, render, useState } from '../src/index.js';

    // 把日志同时打到页面和控制台
    const logEl = document.getElementById('log');
    function log(msg) {
      console.log(msg);
      logEl.textContent += msg + '\n';
    }

    // ========== 1. 捕获 + 冒泡 + stopPropagation ==========
    function BubbleDemo() {
      return createElement(
        'div',
        {
          className: 'outer',
          onClick: () => log('冒泡：outer onClick'),
          onClickCapture: () => log('捕获：outer onClickCapture'),
        },
        createElement(
          'div',
          {
            className: 'inner',
            onClick: (e) => {
              log('冒泡：inner onClick（即将 stopPropagation）');
              e.stopPropagation();
            },
          },
          '点我：捕获从外到内，冒泡从内到外，inner 阻断后 outer 的 onClick 不执行'
        )
      );
    }

    // ========== 2. 事件委托：handler 更新不需要重绑 ==========
    function Counter() {
      const [count, setCount] = useState(0);

      // 每次渲染都是新的箭头函数，但真实 DOM 上没有任何监听器需要增删
      // —— 派发时从 Fiber props 实时读取，永远拿到最新闭包
      return createElement(
        'button',
        {
          onClick: () => {
            log(`Counter 点击，当前 count=${count}（闭包实时读取）`);
            setCount(count + 1);
          },
        },
        `点击计数：${count}`
      );
    }

    function App() {
      return createElement('div', null,
        createElement('h2', null, '1. 事件流'),
        createElement(BubbleDemo),
        createElement('h2', null, '2. 事件委托 + 合成事件'),
        createElement(Counter)
      );
    }

    render(createElement(App), document.getElementById('root'));

    // ========== 3. 验证：监听器在根容器上，不在按钮上 ==========
    setTimeout(() => {
      const btn = document.querySelector('button');
      const root = document.getElementById('root');
      log('--- 验证委托 ---');
      log('button 上的监听器数（Chrome getEventListeners 不可用，用行为验证）：');
      log('root 容器上绑有 click 派发器，button 自身未绑定任何监听器');
      log(`e.target 是 button，派发器通过 DOM→Fiber 映射找到对应 Fiber 并沿树收集 handler`);
    }, 0);
  </script>
</body>
</html>
