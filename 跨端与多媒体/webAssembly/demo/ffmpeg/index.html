<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ffmpeg.wasm 进阶示例 - npm 方案</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 640px;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            h1 {
                font-size: 1.25rem;
            }
            section {
                margin: 1.5rem 0;
                padding: 1rem;
                border: 1px solid #eee;
                border-radius: 8px;
            }
            button {
                padding: 0.5rem 1rem;
                margin: 0.25rem 0.25rem 0.25rem 0;
                cursor: pointer;
            }
            input[type='file'] {
                margin: 0.5rem 0;
            }
            .log {
                margin-top: 0.5rem;
                padding: 0.5rem;
                background: #f5f5f5;
                font-size: 0.85rem;
                max-height: 120px;
                overflow-y: auto;
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <h1>ffmpeg.wasm 进阶示例（npm 本地依赖）</h1>
        <p>视频压缩（调整码率）、添加水印（overlay）</p>

        <section>
            <h2>1. 视频压缩</h2>
            <p>降低码率，减小文件体积（H.264，CRF 28）</p>
            <input type="file" id="videoInput" accept="video/*" />
            <br />
            <button id="compressBtn">压缩视频</button>
        </section>

        <section>
            <h2>2. 添加水印</h2>
            <p>需先选择视频和水印图片，水印将叠加在右下角</p>
            <input type="file" id="videoInput2" accept="video/*" />
            <input type="file" id="watermarkInput" accept="image/*" />
            <br />
            <button id="watermarkBtn">添加水印</button>
        </section>

        <div class="log" id="log"></div>
        <script type="module" src="./main.js"></script>
    </body>
</html>
