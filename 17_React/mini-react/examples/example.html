<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-React 示例</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    #root {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      background: #007bff;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #0056b3;
    }
    .counter {
      font-size: 24px;
      margin: 20px 0;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Mini-React 示例</h1>
  <p>这个示例展示了函数式组件从定义到浏览器渲染的完整流程</p>
  
  <div id="root"></div>

  <script type="module">
    import { createElement, render, useState, useEffect } from '../src/index.js';

    // 计数器组件
    function Counter() {
      const [count, setCount] = useState(0);
      const [name, setName] = useState('Mini-React');

      // useEffect 示例
      useEffect(() => {
        console.log(`Count 更新为: ${count}`);
        return () => {
          console.log(`清理 Count: ${count}`);
        };
      }, [count]);

      useEffect(() => {
        console.log(`Name 更新为: ${name}`);
      }, [name]);

      return createElement('div', { className: 'counter' },
        createElement('h2', null, `Hello, ${name}!`),
        createElement('p', null, `当前计数: `, createElement('strong', null, count)),
        createElement('button', { 
          onClick: () => setCount(count + 1) 
        }, '增加'),
        createElement('button', { 
          onClick: () => setCount(count - 1) 
        }, '减少'),
        createElement('button', { 
          onClick: () => setName(name === 'Mini-React' ? 'React' : 'Mini-React') 
        }, '切换名称')
      );
    }

    // 应用组件
    function App() {
      return createElement('div', null,
        createElement('h1', null, 'Mini-React 示例应用'),
        createElement('p', null, '这是一个使用 Mini-React 构建的简单计数器应用'),
        createElement(Counter, null)
      );
    }

    // 渲染应用
    render(createElement(App), document.getElementById('root'));

    console.log('渲染完成！打开控制台查看 useEffect 的执行情况');
  </script>
</body>
</html>
