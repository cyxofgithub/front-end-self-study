<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>划词笔记 · 设置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: -apple-system, "PingFang SC", sans-serif;
      color: #333;
    }
    h1 { font-size: 18px; margin-bottom: 24px; }
    .field { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    label { width: 90px; color: #666; }
    .status { color: #52c41a; font-size: 13px; margin-top: 8px; height: 18px; }
  </style>
</head>
<body>
  <h1>⚙ 划词笔记设置</h1>
  <div class="field">
    <label for="color">高亮颜色</label>
    <input type="color" id="color" value="#ffe58f" />
  </div>
  <div class="status" id="status"></div>
  <script src="options.js"></script>
</body>
</html>
