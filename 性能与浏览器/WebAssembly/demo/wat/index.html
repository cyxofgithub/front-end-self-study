<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>WAT 手写示例 - add / multiply / max</title>
        <style>
            body {
                font-family: system-ui, sans-serif;
                max-width: 600px;
                margin: 2rem auto;
                padding: 0 1rem;
            }
            h1 {
                font-size: 1.25rem;
            }
            .result {
                margin: 1rem 0;
                padding: 0.75rem;
                background: #f5f5f5;
                border-radius: 6px;
            }
            button {
                padding: 0.5rem 1rem;
                margin-right: 0.5rem;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <h1>WAT 手写示例</h1>
        <p>add(1, 2)、multiply(3, 4)、max(10, 20) 由 WebAssembly 计算</p>
        <button onclick="runDemo()">运行示例</button>
        <div id="output" class="result"></div>

        <script>
            async function runDemo() {
                const output = document.getElementById('output');
                output.textContent = '加载中...';

                try {
                    const [addMod, multiplyMod, maxMod] = await Promise.all([
                        WebAssembly.instantiateStreaming(fetch('add.wasm')),
                        WebAssembly.instantiateStreaming(
                            fetch('multiply.wasm')
                        ),
                        WebAssembly.instantiateStreaming(fetch('max.wasm')),
                    ]);

                    const add = addMod.instance.exports.add;
                    const multiply = multiplyMod.instance.exports.multiply;
                    const max = maxMod.instance.exports.max;

                    const results = [
                        `add(1, 2) = ${add(1, 2)}`,
                        `multiply(3, 4) = ${multiply(3, 4)}`,
                        `max(10, 20) = ${max(10, 20)}`,
                    ];

                    output.textContent = results.join('\n');
                } catch (err) {
                    output.textContent = `错误: ${err.message}\n\n请先运行 npm run build 编译 .wat 文件`;
                }
            }
        </script>
    </body>
</html>
