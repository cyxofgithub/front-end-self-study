<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mini-webpack demo</title>
</head>
<body>
  <div id="app"></div>
  <!-- splitChunks 把 util.js 抽成了共享 chunk（shared.js），必须先于 bundle.js 加载，
       这样 bundle.js 的 runtime 启动时能在队列里拿到 util.js 的工厂 -->
  <script src="/shared.js"></script>
  <script src="/bundle.js"></script>
</body>
</html>
